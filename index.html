<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Face Toggle - Commit 2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>😊 Face Toggle</h1>

        <p id="message">
            I am feeling happy!

        <button onclick="toggleFace()">
            Change Face
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
