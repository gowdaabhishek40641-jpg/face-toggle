<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Advanced Face Toggle</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>😊 Face Toggle</h1>

        <p class="subtitle">
            Change the face using JavaScript
        </p>

        <div id="face" class="face">
            😊
        </div>

        <h2 id="faceName">
            Happy Face
        </h2>

        <p id="message">
            I am feeling happy!
        </p>

        <div class="counter">
            Face <span id="counter">1</span> / 5
        </div>

        <div class="buttons">

            <button onclick="previousFace()">
                ⬅ Previous
            </button>

            <button onclick="toggleFace()">
                Next ➡
            </button>

        </div>

        <button class="randomButton"
            onclick="randomFace()">

            🎲 Random Face

        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
